<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>
<body>
    <div class="columns is-centered">
        <div class="column is-5">
            <section class="section">
            <form action="" id="formBuscador">
                <div>
                    <input class="input is-primary" type="text" id="idpokemon" placeholder="Ejem. 1">
                    <br><br>
                    <button class="button is-primary" type="submit">Buscar Pokemon</button>
                </div>

                <div>
                    <label for="nombre">Nombre Pokemon</label>
                    <input class="input is-primary" type="text" id="nombre">
                </div>

                <div>
                    <label for="numero">Numero en la Pokedex:</label>
                    <input class="input is-primary" type="text" id="numero">
                </div>

                <div>
                    <label for="altura">Altura del pokemon:</label>
                    <input class="input is-primary" type="text" id="altura">
                </div>

                <div>
                    <label for="peso">Peso del pokemon:</label>
                    <input class="input is-primary" type="text" id="peso">
                </div>  
            </form>
            </section>
        </div>
    </div>
    

    <script>
        const formulario = document.getElementById('formBuscador')
        const id = document.getElementById('idpokemon')
        const nombre = document.getElementById('nombre')
        const numero = document.getElementById('numero')
        const altura = document.getElementById('altura')
        const peso = document.getElementById('peso')

        formulario.addEventListener("submit", (event)=> {
            event.preventDefault() //Detener el envio

            obtenerPokemon(id.value.trim().toLowerCase())
        })

        async function obtenerPokemon(id){
            const API_URL = `https://pokeapi.co/api/v2/pokemon/${id}`

            try{
                const respuesta = await fetch(API_URL)
                if(!respuesta.ok) {
                    if(respuesta.status == 404){
                    nombre.value = ''
                    numero.value = ''
                    altura.value = ''
                    peso.value = ''
                    alert('No se encuentra este pokemon')
                }
                throw new Error(`Error de comunicacion: ${respuesta.status}`)
            }
            const datos = await respuesta.json()

            nombre.value = datos.name
            numero.value = datos.id
            altura.value = datos.height
            peso.value = datos.weight
        }catch(e){
            console.error(e)
        }
    }
    </script>
</body>
</html>
